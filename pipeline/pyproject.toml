[project]
name = "mind-the-step"
version = "0.1.0"
description = "Data pipeline for the Mind the Step Data Observatory demo"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27", "lightgbm>=4.5", "numpy>=2.5.4", "openpyxl>=3.1.5", "scipy>=1.18.1"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mind_the_step"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

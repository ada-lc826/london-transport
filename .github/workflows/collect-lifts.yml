name: Collect lift status

# Logs TfL's live lift disruptions every 15 minutes to the `data` branch,
# building the lift-reliability dataset (plan §5.1). GitHub runs schedules
# only from the default branch, and may delay or skip runs under load; the
# log's `ts` field records when each run actually happened.

on:
    schedule:
        # Off the top of the hour, when GitHub's scheduler is busiest.
        - cron: '7,22,37,52 * * * *'
    workflow_dispatch:

permissions:
    contents: write

concurrency:
    group: collect-lifts
    cancel-in-progress: false

jobs:
    collect:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@v4

            - uses: astral-sh/setup-uv@v6
              with:
                  working-directory: pipeline

            - name: Check out the data branch
              run: |
                  git config --global user.name "github-actions[bot]"
                  git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  if git ls-remote --exit-code --heads origin data > /dev/null; then
                    git fetch --depth=1 origin data
                    git worktree add -B data data-branch FETCH_HEAD
                  else
                    git worktree add --orphan -b data data-branch
                  fi

            - name: Fetch lift disruptions
              working-directory: pipeline
              env:
                  TFL_APP_KEY: ${{ secrets.TFL_APP_KEY }}
              run: uv run --frozen python -m mind_the_step.lifts --out ../data-branch

            - name: Commit and push
              working-directory: data-branch
              run: |
                  git add -A
                  if git diff --cached --quiet; then
                    echo "Nothing to commit"
                    exit 0
                  fi
                  git commit -q -m "lifts: $(date -u +%Y-%m-%dT%H:%MZ)"
                  git push origin data

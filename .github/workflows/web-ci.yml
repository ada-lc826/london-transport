name: Web CI

on:
    push:
        paths-ignore: ['pipeline/**', 'docs/**']
    pull_request:
        paths-ignore: ['pipeline/**', 'docs/**']

jobs:
    check:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v7
            - uses: voidzero-dev/setup-vp@v1
              with:
                  cache: true
            # Format, lint and typecheck before building: the linter would also scan build output.
            - run: vp check
            - run: vp run test -r
            - run: vp run build -r

    e2e:
        # Browser tests against the production server build: text never crosses a bezel or
        # gets cut off, in any scene, step or tablet choice; tablets drive screens; late
        # screens catch up; wall health reports connected screens (apps/website/e2e/).
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v7
            - uses: voidzero-dev/setup-vp@v1
              with:
                  cache: true
            - run: vp run build -r
            # The runner image already has Google Chrome. Downloading Playwright's own
            # Chromium has hung after the download for the whole job timeout, so the tests
            # drive the installed Chrome instead (playwright.config.ts reads the channel).
            - name: Check the preinstalled Chrome
              run: google-chrome --version
            - name: Run the end-to-end tests
              working-directory: apps/website
              timeout-minutes: 12
              env:
                  PLAYWRIGHT_CHANNEL: chrome
              run: npx playwright test
            - name: Keep the report if anything failed
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: playwright-results
                  path: apps/website/test-results/

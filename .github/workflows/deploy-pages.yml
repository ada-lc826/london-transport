name: Deploy demo to GitHub Pages

# Builds the static demo (no server: the in-browser bus in src/lib/realtime/local-bus.ts
# stands in for the WebSocket one) and publishes it at https://<owner>.github.io/<repo>/.
# Needs Settings → Pages → Source: "GitHub Actions" once. Runs daily too, so S5 shows the
# lift log up to that morning: lifts.json is rebuilt from the `data` branch before building.

on:
    push:
        branches: [main]
        paths: ['apps/website/**', '.github/workflows/deploy-pages.yml']
    workflow_dispatch:
    schedule:
        - cron: '17 6 * * *'

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v7
            - uses: voidzero-dev/setup-vp@v1
              with:
                  cache: true
            - uses: astral-sh/setup-uv@v7
              with:
                  working-directory: pipeline
            - name: Bring S5's lift record up to date
              run: |
                  git fetch --depth=1 origin data
                  git worktree add data-branch FETCH_HEAD
                  cd pipeline
                  uv run --frozen python -m mind_the_step.lift_outages --log ../data-branch \
                    --topology ../data/tfl-station-topology/2026-10-20 \
                    --network ../apps/website/public/data/network.json \
                    --out ../apps/website/public/data/lifts.json
            - name: Build the static demo
              working-directory: apps/website
              env:
                  STATIC_DEMO: '1'
                  BASE_PATH: /${{ github.event.repository.name }}/
              run: vp build
            - name: Add the entry points Pages serves
              working-directory: apps/website/.output/public
              # index.html for the site root; 404.html for every other path (/world, /control,
              # /screen), which the app then routes on the client.
              run: |
                  cp _shell.html index.html
                  cp _shell.html 404.html
                  touch .nojekyll
            - uses: actions/upload-pages-artifact@v4
              with:
                  path: apps/website/.output/public

    deploy:
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - id: deployment
              uses: actions/deploy-pages@v4

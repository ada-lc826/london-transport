name: Snapshot network data

# Fetches TfL stations, lines and route sequences (pipeline/src/mind_the_step/snapshot.py) and
# commits them to the `data` branch under snapshots/<date>/. Run by hand when the network
# changes; the scenes are built from the latest snapshot.

on:
    workflow_dispatch:

permissions:
    contents: write

# Its own group: the lift logger runs for hours at a time. Both push through
# commit-data.sh, which rebases onto the other's commits.
concurrency:
    group: snapshot-network
    cancel-in-progress: false

jobs:
    snapshot:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v7

            - uses: astral-sh/setup-uv@v7
              with:
                  working-directory: pipeline

            - name: Check out the data branch
              run: |
                  git config --global user.name "github-actions[bot]"
                  git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git fetch --depth=50 origin data
                  git worktree add -B data data-branch FETCH_HEAD

            - name: Fetch network data
              working-directory: pipeline
              env:
                  TFL_APP_KEY: ${{ secrets.TFL_APP_KEY }}
              run: uv run --frozen python -m mind_the_step.snapshot --out ../data-branch

            - name: Commit and push
              run: |
                  .github/scripts/commit-data.sh data-branch "snapshot: $(date -u +%Y-%m-%dT%H:%MZ)"
